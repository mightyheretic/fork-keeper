name: forkkeeper

services:
  forkkeeper:
    build:
      context: .
      args:
        VERSION: ${FORKKEEPER_VERSION:-dev}
    image: forkkeeper:${FORKKEEPER_VERSION:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      FORKKEEPER_WEBHOOK_ADDR: ":8080"
      FORKKEEPER_API_ADDR: ":8081"
    # Hardening (spec §6.5): unprivileged, read-only rootfs, no capabilities.
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - forkkeeper-data:/var/lib/forkkeeper
      - ./config/forkkeeper.yaml:/etc/forkkeeper/config.yaml:ro
    # Read by the `file` credential provider from $CREDENTIALS_DIRECTORY (/run/secrets).
    # Never bake secrets into the image.
    # Each listed secret's file must exist, or Compose won't start.
    secrets:
      - github_webhook_secret
      - github_pat
      # - github_app_private_key   # enable once the GitHub App exists
    ports:
      # Private API: bound to localhost by default. Set API_BIND to a Tailscale or
      # WireGuard address to reach it from other devices. Never 0.0.0.0.
      - "${API_BIND:-127.0.0.1}:8081:8081"
    networks: [edge, egress]
    # Do NOT mount the Docker socket here. Upstream CI runs in a separate sandbox (spec §6.3).

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      forkkeeper:
        condition: service_healthy
    environment:
      FORKKEEPER_DOMAIN: ${FORKKEEPER_DOMAIN:?set FORKKEEPER_DOMAIN in .env}
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]

networks:
  # Caddy <-> forkkeeper only.
  edge:
  # Outbound access for GitHub, archive mirrors and notifications.
  egress:

volumes:
  forkkeeper-data:
  caddy-data:
  caddy-config:

secrets:
  github_webhook_secret:
    file: ./secrets/github_webhook_secret
  github_pat:
    file: ./secrets/github_pat
  # github_app_private_key:
  #   file: ./secrets/github_app_private_key.pem
