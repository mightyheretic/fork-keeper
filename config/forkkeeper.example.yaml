# Fork Keeper configuration. Copy to config/forkkeeper.yaml (gitignored) and edit.
# This is a draft schema based on docs/spec.md and will change as V1 is built.

data_dir: ${FORKKEEPER_DATA_DIR:-/var/lib/forkkeeper}
database:
  driver: sqlite   # only sqlite for now
  # path defaults to <data_dir>/forkkeeper.db

# Where secrets come from. Config values below name credentials; they never
# contain the secrets themselves.
credentials:
  provider: file   # file | env | command
  file:
    # /run/secrets in the container (Compose secrets), or systemd's
    # $CREDENTIALS_DIRECTORY when running natively.
    dir: ${CREDENTIALS_DIRECTORY:-/run/secrets}
  # env:
  #   prefix: FORKKEEPER_CRED_   # github_webhook_secret -> FORKKEEPER_CRED_GITHUB_WEBHOOK_SECRET
  # command:                     # only useful outside the container (no tools in the image)
  #   argv: [pass, show, "forkkeeper/{name}"]
  #   timeout: 10s

github:
  # api_url: https://api.github.com   # change for GitHub Enterprise Server
  webhook_secret: github_webhook_secret
  auth:
    default:
      type: app
      app_id: ${GITHUB_APP_ID}
      # Leave unset to look up the installation for each repo automatically.
      # installation_id: 12345678
      private_key: github_app_private_key
    # Fallback for quick setups: a fine-grained PAT limited to your forks.
    # personal:
    #   type: pat
    #   token: github_pat
  # Map repos to auth profiles. Most specific wins; unmatched repos use "default".
  # repo_auth:
  #   "some-org/*": personal
  #   "your-user/special-fork": personal

# Upstream release polling. Webhooks only reach repos where the GitHub App is
# installed (your forks), so polling is how upstream releases are found.
watcher:
  poll_interval: 15m
  include_prereleases: false
  # Auth profile for polling, or "anonymous" (60 requests/hour). When unset,
  # github.repo_auth is applied to each upstream name, else anonymous. A
  # fine-grained PAT with read access to public repos is the simplest choice.
  # auth: personal

notifications:
  ntfy:
    url: https://ntfy.sh/your-topic

# What to do when an upstream's licenses change between versions.
#   from:    licenses in the previous version (default: any)
#   to:      licenses added in the new version
#   removed: licenses dropped in the new version (a rule needs to and/or removed)
# Patterns: SPDX IDs, globs (GPL-*), any, not-allowed (outside the allowlist),
# unknown (no license, or one that couldn't be identified).
# Actions: freeze, block_auto_merge, require_approval, flag_pr, notify, archive,
#          maintenance_branch, allow.
# Scope: repos: [...] or groups: [...]; neither means global. The most specific
# matching rule wins (repo > group > global, then priority, then file order).
license:
  allowlist: [MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0]
  default_actions: [require_approval, notify]   # licenses changed, no rule matched
  rules:
    - name: relicense-to-source-available
      from: [MIT, Apache-2.0, BSD-*, MPL-2.0]
      to: [BUSL-1.1, SSPL-1.0, Elastic-2.0, LicenseRef-RSAL-2.0, FSL-*, LicenseRef-Commons-Clause]
      actions: [freeze, archive, notify]
    - name: gpl2-to-gpl3
      from: [GPL-2.0-only, GPL-2.0-or-later]
      to: [GPL-3.0-only, GPL-3.0-or-later]
      actions: [require_approval]
    - name: license-lost
      to: [unknown]
      actions: [block_auto_merge, notify]
    - name: outside-allowlist
      to: [not-allowed]
      level: any          # also nested license files and file headers
      actions: [require_approval, flag_pr, notify]
    # Per-repo override example:
    # - name: some-app-is-fine
    #   repos: [upstream-org/some-app]
    #   to: [any]
    #   actions: [allow]

repos:
  - upstream: upstream-org/some-app
    fork: your-user/some-app        # optional until the merge engine lands
    watch: releases                 # releases | tags (for projects that only tag)
    groups: [apps]                  # optional, for group-scoped license rules
    # include_prereleases: true     # overrides watcher.include_prereleases
    stable_branch: main
    staging_branch: forkkeeper/staging
    merge_strategy: merge   # merge | rebase | patch-stack
    archive:
      mirrors: []
      software_heritage: true
