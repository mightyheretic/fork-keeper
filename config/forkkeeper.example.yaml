# Fork Keeper configuration. Copy to config/forkkeeper.yaml (gitignored) and edit.
# This is a draft schema based on docs/spec.md and will change as V1 is built.

data_dir: ${FORKKEEPER_DATA_DIR:-/var/lib/forkkeeper}
database:
  driver: sqlite   # only sqlite for now
  # path defaults to <data_dir>/forkkeeper.db

# Where secrets come from. Config values below name credentials; they never
# contain the secrets themselves.
credentials:
  provider: file   # file | env | command
  file:
    # /run/secrets in the container (Compose secrets), or systemd's
    # $CREDENTIALS_DIRECTORY when running natively.
    dir: ${CREDENTIALS_DIRECTORY:-/run/secrets}
  # env:
  #   prefix: FORKKEEPER_CRED_   # github_webhook_secret -> FORKKEEPER_CRED_GITHUB_WEBHOOK_SECRET
  # command:                     # only useful outside the container (no tools in the image)
  #   argv: [pass, show, "forkkeeper/{name}"]
  #   timeout: 10s

github:
  # api_url: https://api.github.com   # change for GitHub Enterprise Server
  webhook_secret: github_webhook_secret
  auth:
    default:
      type: app
      app_id: ${GITHUB_APP_ID}
      # Leave unset to look up the installation for each repo automatically.
      # installation_id: 12345678
      private_key: github_app_private_key
    # Fallback for quick setups: a fine-grained PAT limited to your forks.
    # personal:
    #   type: pat
    #   token: github_pat
  # Map repos to auth profiles. Most specific wins; unmatched repos use "default".
  # repo_auth:
  #   "some-org/*": personal
  #   "your-user/special-fork": personal

# Upstream release polling. Webhooks only reach repos where the GitHub App is
# installed (your forks), so polling is how upstream releases are found.
watcher:
  poll_interval: 15m
  include_prereleases: false
  # Auth profile for polling, or "anonymous" (60 requests/hour). When unset,
  # github.repo_auth is applied to each upstream name, else anonymous. A
  # fine-grained PAT with read access to public repos is the simplest choice.
  # auth: personal
  # Early warning: also check each upstream's default branch for top-level
  # license changes between releases (nothing from it is merged). Repos can
  # override it with main_branch: false.
  main_branch: true

# Merge engine: merges each new release into repos[].fork on a staging
# branch and opens a PR into the stable branch.
merge:
  auto_merge: true        # merge PRs with an "auto" policy once CI passes
  require_ci: true        # ...and only after at least one check has reported
  check_interval: 5m      # how often open sync PRs are checked
  committer_name: Fork Keeper
  committer_email: forkkeeper@localhost

# Source backups of upstream releases: git history and tags, never release
# assets. Kept under <data_dir>/archive; tags are only ever added, so a tag
# upstream moves or deletes keeps its original commit.
archive:
  releases: minor          # major (X.0.0) | minor (X.Y.0) | all | none
  push_to_fork: true       # copy backups to the fork, under hidden refs/forkkeeper/archive/
  software_heritage: true  # ask Software Heritage to archive the upstream (at most daily)
  # software_heritage_token: swh_token   # optional credential name
  mirrors: []
  # mirrors:
  #   - url: https://codeberg.org/your-user/{name}.git   # {owner}, {name} filled in
  #     token: codeberg_token                            # credential name
  #     username: your-user    # default x-access-token (GitHub); GitLab: oauth2
  #     refs: hidden           # hidden (default) | tags (dedicated backup repo)

# Where messages go: license warnings, approvals (with reminders), and sync
# problems. Configure any of these; each message goes to all of them. URLs
# must be https://, except localhost and private or Tailscale addresses.
notifications:
  ntfy:
    url: https://ntfy.sh/your-secret-topic   # topic URL; anyone with the topic can read it
    # token: ntfy_token                      # optional credential name (access token)
  # gotify:
  #   url: https://gotify.example.com
  #   token: gotify_token                    # application token (credential name)
  # email:
  #   smtp: smtp.example.com:587             # STARTTLS required; port 465 for implicit TLS
  #   username: you@example.com
  #   password: smtp_password                # credential name
  #   from: Fork Keeper <forkkeeper@example.com>
  #   to: [you@example.com]
  # webhook:                                 # POSTs each message as JSON
  #   url: https://example.com/hooks/forkkeeper
  #   token: webhook_token                   # optional, sent as a bearer token
  approvals: true      # notify approvals even when the rule has no notify action
  remind_after: 72h    # remind about pending approvals; 0 turns reminders off
  sync_problems: true  # merge conflicts, CI failures on sync PRs

# What to do when an upstream's licenses change between versions.
# Rules run when the project's own (top-level) license changes: the declared
# expression, root license files and manifests. Nested license files and file
# headers ("sub-licenses") are handled per repo by repos[].sub_licenses:
#   escalate (default): act only if a sub-license brings in a license that is
#            new to the project and not on the allowlist (e.g. a BUSL ee/
#            directory); runs escalation_actions. Vendored MIT/Apache license
#            files are ignored.
#   ignore:  never act on sub-licenses.
#   all:     any sub-license change counts, and rules also match licenses
#            added in nested files and headers.
#   from:    licenses in the previous version (default: any)
#   to:      licenses added in the new version
#   removed: licenses dropped in the new version (a rule needs to and/or removed)
# Patterns: SPDX IDs, globs (GPL-*), any, not-allowed (outside the allowlist),
# unknown (no license, or one that couldn't be identified).
# Actions: freeze, block_auto_merge, require_approval, flag_pr, notify, archive
#          (back up the version before the change), maintenance_branch, allow.
# Scope: repos: [...] or groups: [...]; neither means global. The most specific
# matching rule wins (repo > group > global, then priority, then file order).
license:
  allowlist: [MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0]
  default_actions: [require_approval, notify]   # licenses changed, no rule matched
  escalation_actions: [require_approval, flag_pr, notify]   # sub_licenses: escalate
  rules:
    - name: relicense-to-source-available
      from: [MIT, Apache-2.0, BSD-*, MPL-2.0]
      to: [BUSL-1.1, SSPL-1.0, Elastic-2.0, LicenseRef-RSAL-2.0, FSL-*, LicenseRef-Commons-Clause]
      actions: [freeze, archive, notify]
    - name: gpl2-to-gpl3
      from: [GPL-2.0-only, GPL-2.0-or-later]
      to: [GPL-3.0-only, GPL-3.0-or-later]
      actions: [require_approval]
    - name: license-lost
      to: [unknown]
      actions: [block_auto_merge, notify]
    - name: outside-allowlist
      to: [not-allowed]
      actions: [require_approval, flag_pr, notify]
    # Per-repo override example:
    # - name: some-app-is-fine
    #   repos: [upstream-org/some-app]
    #   to: [any]
    #   actions: [allow]

repos:
  - upstream: upstream-org/some-app
    fork: your-user/some-app        # optional; without it the upstream is only watched
    watch: releases                 # releases | tags (for projects that only tag)
    groups: [apps]                  # optional, for group-scoped license rules
    # sub_licenses: escalate        # escalate | ignore | all (see license: above)
    # include_prereleases: true     # overrides watcher.include_prereleases
    stable_branch: main             # default: the fork's default branch
    staging_branch: forkkeeper/staging
    # merge: full-history merge, re-applying local patches if it conflicts (default)
    # patch-stack: always re-apply local patches on top of upstream (alias: rebase)
    # merge-only: merge, and report conflicts without trying the patch stack
    merge_strategy: merge
    # main_branch: false            # overrides watcher.main_branch
    archive:                        # overrides the top-level archive settings
      releases: minor
      mirrors: []                   # added to the top-level mirrors
      software_heritage: true
